name: Publish to Modrinth

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release channel on Modrinth"
        type: choice
        options: [release, beta, alpha]
        default: release
      changelog:
        description: "Changelog (Markdown, empty = default text)"
        type: string
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [1.21, 26.x, main]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: |
          chmod +x gradlew
          ./gradlew build --parallel

      - name: Publish to Modrinth
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_CHANGELOG: ${{ inputs.changelog }}
        run: ./gradlew modrinth --no-configuration-cache --parallel "-Prelease_channel=${{ inputs.release_type }}"
