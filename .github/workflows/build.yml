name: Build mod jar

on:
  push:
    branches: ["26.x", "1.21"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        # 1.21 ships the remapped jar (intermediary -> production mappings);
        # 26.x ships shadowJar directly (see its modrinth/publish config).
        run: |
          if [[ "${{ github.ref_name }}" == 1.21* ]]; then
            ./gradlew remapJar --no-daemon
          else
            ./gradlew shadowJar --no-daemon
          fi

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar-${{ github.ref_name }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
