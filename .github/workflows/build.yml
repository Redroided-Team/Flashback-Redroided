name: Build

on:
  push:
    branches: ["1.21", "26.x", "main"]
    tags: ["v*"]
  pull_request:
    branches: ["1.21", "26.x", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [1.21, 26.x, main]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: |
          chmod +x gradlew
          ./gradlew build --parallel

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fba-${{ matrix.branch }}-${{ github.sha }}
          path: build/libs/fba-*+mc*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          pattern: fba-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true

  dev-release:
    if: github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A single rolling tag is updated by every branch push. Serialize runs so
    # concurrent builds don't delete/upload the same asset simultaneously
    # (that race makes GitHub 404 the upload).
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          pattern: fba-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Publish rolling dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev build
          body: |
            Latest dev build @ ${{ github.sha }}

            Supported Minecraft versions:
            | Jar | Minecraft versions |
            | --- | --- |
            | `1.21` | 1.21 – 1.21.11 |
            | `26.x` | 26.1 – 26.2 |
            | `main` | 26.3 |
          prerelease: true
          files: dist/*.jar