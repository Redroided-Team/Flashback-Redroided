plugins {
id 'net.fabricmc.fabric-loom' version "${loom_version}"
id 'com.gradleup.shadow' version '9.2.2'
id 'maven-publish'
id 'com.modrinth.minotaur' version '2.9.0'
id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

group = project.maven_group
version = project.mod_version

def mcVersions = ((project.findProperty("mc_versions") ?: project.minecraft_version).toString()).split(",").collect { it.trim() }.findAll { !it.isEmpty() }

modrinth {
token = System.getenv("MODRINTH_TOKEN")
projectId = project.findProperty("modrinth_id") ?: ""
versionNumber = project.mod_version
versionType = project.findProperty("release_channel") ?: "release"
gameVersions = mcVersions
loaders = ["fabric"]
changelog = System.getenv("MODRINTH_CHANGELOG") ?: "See GitHub releases for changelog: https://github.com/Redroided-Team/Flashback-Redroided/releases"
uploadFile = tasks.named("shadowJar")
}

publishMods {
file = shadowJar.archiveFile
displayName = "${project.archives_base_name}-${project.mc_range}-${project.mod_version}"
version = project.mod_version
changelog = System.getenv("CURSEFORGE_CHANGELOG") ?: System.getenv("MODRINTH_CHANGELOG") ?: "See GitHub releases for changelog: https://github.com/Redroided-Team/Flashback-Redroided/releases"
def channel = (project.findProperty("release_channel") ?: "release").toString()
type = channel == "alpha" ? ALPHA : channel == "beta" ? BETA : STABLE
modLoaders.add("fabric")

curseforge {
projectId = project.findProperty("curseforge_id") ?: ""
accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
minecraftVersions.addAll(mcVersions)
client = true
requires("fabric-api")
}
}

base {
archivesName = project.archives_base_name
}

repositories {
maven {
name = "Modrinth"
url = "https://api.modrinth.com/maven"
}
maven {
name = "Fabric"
url = "https://maven.fabricmc.net/"
}
mavenCentral()
}

loom {
splitEnvironmentSourceSets()

mods {
    "flashback_android" {
        sourceSet sourceSets.main
        sourceSet sourceSets.client
    }
}

}

dependencies {
minecraft "com.mojang:minecraft:${minecraft_version}"
implementation "net.fabricmc:fabric-loader:${loader_version}"
implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

compileOnly "maven.modrinth:4das1Fjq:${flashback_version}"

// Compile-only: MC 26.3 ships the SDL dialog bindings (and Flashback
// drives its dialogs through them), so the game/launcher provides these
// classes at runtime. Referenced only from inside guarded legs, so a
// launcher without them cascades to the fallback instead of breaking
// mixin loading. Strictly compile-only: embedding LWJGL would shadow the
// launcher's org.lwjgl.Version (Sodium's gh-2561 check does exactly that).
compileOnly "org.lwjgl:lwjgl-sdl:3.4.1"

shadow "org.bytedeco:ffmpeg:8.1.2-1.5.14"
shadow "org.bytedeco:ffmpeg:8.1.2-1.5.14:android-arm64-gpl"
shadow "org.bytedeco:javacpp:1.5.14"
shadow "org.bytedeco:javacpp:1.5.14:android-arm64"

shadow files("deps/imgui-binding-1.90.0.jar")
shadow files("deps/imgui-java-natives-android.jar")

}

def modVersion = providers.gradleProperty("mod_version")

def buildHash = providers.exec { commandLine("git", "rev-parse", "--short", "HEAD") }.standardOutput.asText.get().trim()

processResources {
inputs.property("version", modVersion)
inputs.property("buildHash", buildHash)

filesMatching("fabric.mod.json") {
    expand(version: modVersion.get(), buildHash: buildHash)
}

filesMatching("fba-build.txt") {
    expand(buildHash: buildHash)
}

}

java {
sourceCompatibility = JavaVersion.VERSION_25
targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
options.release = 25
}

jar {
archiveBaseName.set(project.archives_base_name)

from("LICENSE") {
    into "META-INF"
    rename { "${it}_flashback-android" }
}

from("NOTICE") {
    into "META-INF"
}

}

shadowJar {
archiveBaseName.set("${project.archives_base_name}-${project.mc_range}")
archiveVersion.set("${project.version}+${buildHash}")
archiveClassifier.set("")
destinationDirectory.set(layout.buildDirectory.dir("libs"))

from(sourceSets.main.output)
from(sourceSets.client.output)

from("LICENSE") {
    into "META-INF"
    rename { "${it}_flashback-android" }
}

from("NOTICE") {
    into "META-INF"
}

configurations = [project.configurations.shadow]

exclude("org/bytedeco/javacpp/tools/Builder*")
exclude("org/bytedeco/javacpp/tools/BuildMojo*")
exclude("org/bytedeco/javacpp/tools/CacheMojo*")
exclude("org/bytedeco/javacpp/tools/ClearMojo*")
exclude("org/bytedeco/javacpp/tools/ParseMojo*")
exclude("org/bytedeco/javacpp/tools/CommandExecutor*")
exclude("org/bytedeco/javacpp/tools/UserClassLoader*")
exclude("org/bytedeco/javacpp/tools/ClassScanner*")
exclude("org/bytedeco/javacpp/tools/ClassFilter*")
    exclude("org/bytedeco/javacpp/chrono/**")
    exclude("META-INF/maven/**")
    exclude("META-INF/native-image/**")
    // Dead CLI executables from the FFmpeg Android jar. Nothing loads or
    // executes them: JavaCPP's Loader extraction is disabled on Android
    // (NativeLoader sets loadlibraries=false and System.loads the .so
    // files directly), and no code references these paths. Dropping them
    // also keeps executable binaries out of the distributed mod JAR.
    exclude("lib/arm64-v8a/ffmpeg")
    exclude("lib/arm64-v8a/ffprobe")
    // Defensive: this mod only supports Android ARM64 (see NativeLoader).
    // Never ship other-ABI natives or multi-release module-info stubs even
    // if a future dependency jar starts bundling them.
    exclude("lib/armeabi-v7a/**")
    exclude("lib/x86/**")
    exclude("lib/x86_64/**")
    exclude("META-INF/versions/**")

manifest {
    attributes("Class-Path": "")
}

doLast {
    def f = archiveFile.get().asFile
    def tmp = new File(f.parentFile, f.name + ".nomanifestpath")
    f.withInputStream { zin ->
        def zis = new java.util.zip.ZipInputStream(zin)
        def zos = new java.util.zip.ZipOutputStream(tmp.newOutputStream())
        def entry
        def buf = new byte[8192]
        int n
        while ((entry = zis.nextEntry) != null) {
            zos.putNextEntry(new java.util.zip.ZipEntry(entry.name).tap {
                time = entry.time
            })
            if (entry.name == "META-INF/MANIFEST.MF") {
                def baos = new ByteArrayOutputStream()
                while ((n = zis.read(buf)) != -1) {
                    baos.write(buf, 0, n)
                }
                def text = baos.toString("UTF-8")
                text = text.replaceAll(/(?m)^Class-Path:[^\r\n]*(\r?\n[ \t][^\r\n]*)*\r?\n/, "")
                zos.write(text.getBytes("UTF-8"))
            } else {
                while ((n = zis.read(buf)) != -1) {
                    zos.write(buf, 0, n)
                }
            }
            zos.closeEntry()
        }
        zos.close()
    }
    if (!tmp.renameTo(f)) {
        f.delete()
        tmp.renameTo(f)
    }
}
}

tasks.named("assemble") {
dependsOn(shadowJar)
}