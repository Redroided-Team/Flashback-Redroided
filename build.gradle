plugins {
id 'net.fabricmc.fabric-loom' version "${loom_version}"
id 'com.gradleup.shadow' version '9.2.2'
id 'maven-publish'
id 'com.modrinth.minotaur' version '2.9.0'
id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

group = project.maven_group
version = project.mod_version

modrinth {
token = System.getenv("MODRINTH_TOKEN")
projectId = project.findProperty("modrinth_id") ?: ""
versionNumber = project.mod_version
versionType = project.findProperty("release_channel") ?: "release"
gameVersions = [project.minecraft_version]
loaders = ["fabric"]
changelog = System.getenv("MODRINTH_CHANGELOG") ?: "See GitHub releases for changelog: https://github.com/Redroided-Team/Flashback-Redroided/releases"
uploadFile = tasks.named("shadowJar")
}

publishMods {
file = shadowJar.archiveFile
displayName = "${project.archives_base_name}-${project.minecraft_version}-${project.mod_version}"
version = project.mod_version
changelog = System.getenv("CURSEFORGE_CHANGELOG") ?: System.getenv("MODRINTH_CHANGELOG") ?: "See GitHub releases for changelog: https://github.com/Redroided-Team/Flashback-Redroided/releases"
def channel = (project.findProperty("release_channel") ?: "release").toString()
type = channel == "alpha" ? ALPHA : channel == "beta" ? BETA : STABLE
modLoaders.add("fabric")

curseforge {
projectId = project.findProperty("curseforge_id") ?: ""
accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
minecraftVersions.add(project.minecraft_version)
client = true
requires("fabric-api")
}
}

base {
archivesName = project.archives_base_name
}

repositories {
maven {
name = "Modrinth"
url = "https://api.modrinth.com/maven"
}
maven {
name = "Fabric"
url = "https://maven.fabricmc.net/"
}
mavenCentral()
}

loom {
splitEnvironmentSourceSets()

mods {
    "flashback_android" {
        sourceSet sourceSets.main
        sourceSet sourceSets.client
    }
}

}

dependencies {
minecraft "com.mojang:minecraft:${minecraft_version}"
implementation "net.fabricmc:fabric-loader:${loader_version}"
implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

compileOnly "maven.modrinth:4das1Fjq:${flashback_version}"

// @WrapOperation injections are inert without MixinExtras (neither Fabric
// Loader nor Flashback ship it). Shadowed like the rest of this branch's
// dependencies, mirroring 1.21 which bundles it via Jar-in-Jar.
shadow files("deps/mixinextras-fabric-0.5.5.jar")

// Compile-only: MC and launchers provide these dialog bindings at runtime.
// MC 26.2 itself ships lwjgl-tinyfd but not lwjgl-nfd, so NFD is only present
// when the launcher supplies it. Both are referenced from inside guarded legs,
// so a launcher without them cascades to the next leg instead of breaking
// mixin loading.
compileOnly "org.lwjgl:lwjgl-nfd:3.4.1"
compileOnly "org.lwjgl:lwjgl-tinyfd:3.4.1"

shadow files("ffmpeg/javacpp.jar")
shadow files("ffmpeg/javacpp-android-arm64.jar")
shadow files("ffmpeg/ffmpeg.jar")
shadow files("ffmpeg/ffmpeg-android-arm64-gpl.jar")

shadow files("deps/imgui-binding-1.90.0.jar")
shadow files("deps/imgui-java-natives-android.jar")

}

def modVersion = providers.gradleProperty("mod_version")

def buildHash = providers.exec { commandLine("git", "rev-parse", "--short", "HEAD") }.standardOutput.asText.get().trim()
processResources {
inputs.property("version", modVersion)
inputs.property("buildHash", buildHash)

filesMatching("fabric.mod.json") {
    expand(version: modVersion.get(), buildHash: buildHash)
}

filesMatching("fba-build.txt") {
    expand(buildHash: buildHash)
}

}

java {
sourceCompatibility = JavaVersion.VERSION_25
targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
options.release = 25
}

jar {
    archiveBaseName.set(project.archives_base_name)

    from("LICENSE") {
        into "META-INF"
        rename { "${it}_flashback-android" }
    }

    from("NOTICE") {
        into "META-INF"
    }

}

shadowJar {
    archiveBaseName.set("${project.archives_base_name}-${project.mc_range}")
    archiveVersion.set(project.version.toString())
    archiveClassifier.set("")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))

    from(sourceSets.main.output)
    from(sourceSets.client.output)

    from("LICENSE") {
        into "META-INF"
        rename { "${it}_flashback-android" }
    }

    from("NOTICE") {
        into "META-INF"
    }

    configurations = [project.configurations.shadow]

    exclude("org/bytedeco/javacpp/tools/Builder*")
    exclude("org/bytedeco/javacpp/tools/BuildMojo*")
    exclude("org/bytedeco/javacpp/tools/CacheMojo*")
    exclude("org/bytedeco/javacpp/tools/ClearMojo*")
    exclude("org/bytedeco/javacpp/tools/ParseMojo*")
    exclude("org/bytedeco/javacpp/tools/CommandExecutor*")
    exclude("org/bytedeco/javacpp/tools/UserClassLoader*")
    exclude("org/bytedeco/javacpp/tools/ClassScanner*")
    exclude("org/bytedeco/javacpp/tools/ClassFilter*")
    exclude("org/bytedeco/javacpp/chrono/**")
    exclude("META-INF/maven/**")
    exclude("META-INF/native-image/**")

    manifest {
        attributes("Class-Path": "")
    }

    doLast {
        def f = archiveFile.get().asFile
        def tmp = new File(f.parentFile, f.name + ".nomanifestpath")
        f.withInputStream { zin ->
            def zis = new java.util.zip.ZipInputStream(zin)
            def zos = new java.util.zip.ZipOutputStream(tmp.newOutputStream())
            def entry
            def buf = new byte[8192]
            int n
            while ((entry = zis.nextEntry) != null) {
                zos.putNextEntry(new java.util.zip.ZipEntry(entry.name).tap {
                    time = entry.time
                })
                if (entry.name == "META-INF/MANIFEST.MF") {
                    def baos = new ByteArrayOutputStream()
                    while ((n = zis.read(buf)) != -1) {
                        baos.write(buf, 0, n)
                    }
                    def text = baos.toString("UTF-8")
                    text = text.replaceAll(/(?m)^Class-Path:[^\r\n]*(\r?\n[ \t][^\r\n]*)*\r?\n/, "")
                    zos.write(text.getBytes("UTF-8"))
                } else {
                    while ((n = zis.read(buf)) != -1) {
                        zos.write(buf, 0, n)
                    }
                }
                zos.closeEntry()
            }
            zos.close()
        }
        if (!tmp.renameTo(f)) {
            f.delete()
            tmp.renameTo(f)
        }
    }
}

tasks.named("assemble") {
dependsOn(shadowJar)
}